services:
  vh-srv-accounting:
    image: "${IMAGE_NAME}"
    container_name: 'vh-srv-accounting'
    restart: unless-stopped
    env_file: .env
    cpus: '0.5'
    mem_limit: 250M
    ports:
      # Bound to loopback: host nginx is the only thing that talks to this, and
      # firewalld is disabled on the Rocky 9 hosts, so a 0.0.0.0 mapping would
      # publish the service straight onto the VM's public IP, bypassing the
      # edge LB and nginx entirely.
      - "127.0.0.1:8190:8190"
networks:
  # Short form. The long form (networks.default.external.name) was removed from
  # Compose and fails outright on the Rocky 9 hosts, which ship Compose 5.3.
  default:
    name: vh
    external: true
